name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p kuracare-core --all-targets -- -D warnings
      - run: cargo test -p kuracare-core
      - name: The core has no networking crates
        run: |
          found=$(cargo tree -q -p kuracare-core -e normal --prefix none | sed 's/ v.*//' | sort -u \
            | grep -ixE 'reqwest|hyper|ureq|tungstenite|curl|h2|rustls|native-tls|openssl|attohttpc' || true)
          if [ -n "$found" ]; then echo "Networking crates in kuracare-core: $found"; exit 1; fi

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
      - run: cargo clippy -p kuracare-app --features desktop -- -D warnings
