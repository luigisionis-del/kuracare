# Kuracare: static files only. The server never sees personal data.
# Replace kuracare.example with the real domain; TLS via certbot or similar.
# Copy kuracare-headers.conf to /etc/nginx/snippets/.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kuracare.example;

    # ssl_certificate     /etc/letsencrypt/live/kuracare.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kuracare.example/privkey.pem;

    root /srv/kuracare/dist;
    index index.html;

    # No access logs: visit times would themselves be personal metadata.
    access_log off;
    server_tokens off;

    # Hashed assets: cache forever.
    location /assets/ {
        include snippets/kuracare-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker, manifest and page must always be revalidated.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        include snippets/kuracare-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        include snippets/kuracare-headers.conf;
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name kuracare.example;
    return 301 https://$host$request_uri;
}
