[package]
name = "kuracare-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes-gcm = "0.11.1"
aes-kw = "0.3.1"
argon2 = "0.6.0"
jiff = "1.0.1"
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.3", features = ["v4"] }
zeroize = { version = "1.9.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
